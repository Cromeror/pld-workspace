pm_proposal:
  problem: >-
    El wizard de creación de notarías e inmobiliarias quedó desactualizado. Necesitamos actualizar
    las validaciones tanto BE como FE para que coincidan con el diseño actualizado en Figma.


    ## Estructura del wizard según Figma (sección Notario, archivo PLD tR7Y1QD0Ic0aY9OOpcJ9ww, node
    1584:58143)


    El wizard tiene 5 pasos:

    - Paso 1: Datos de identificación

    - Paso 2: Datos de Contacto

    - Paso 3: Actividad vulnerable

    - Paso 4: Responsable del cumplimiento de la Ley

    - Paso 5: Revisión y validación


    ### Paso 0 — Selección de tipo

    - Selector: Notario / Inmobiliarias

    - Sub-tipo: Persona física / Persona moral


    ### Paso 1 — Datos de identificación (Persona física)

    Campos: Nombre(s)*, Primer apellido*, Segundo apellido*, Fecha de nacimiento, RFC, CURP, País de
    nacionalidad, País de nacimiento, Lugar de nacimiento, No. interior (opcional)


    ### Paso 2 — Datos de Contacto

    Campos: Clave lada, Numero de teléfono, Correo electrónico*, Numero de celular*

    (Hay dos variantes: con y sin 'Agregar contacto' — el diseño muestra soporte para múltiples
    contactos)


    ### Paso 3 — Actividad vulnerable

    Campos: Selección de actividad vulnerable (ej: 'FE PÚBLICA (CORREDORES Y NOTARIOS)',
    'TRANSMISION DE BIENES INMUEBLES'), Fecha inicial

    Domicilio principal de la actividad vulnerable: Código postal, Entidad federativa, Delegación o
    municipio, Localidad, Colonia, Tipo de vialidad, Nombre de la calle o vialidad, Número exterior,
    Número interior

    Boton: 'Agregar actividad vulnerable' (soporta múltiples actividades)


    ### Paso 4 — Responsable del cumplimiento de la Ley

    (presente en el stepper pero sin frame detallado en la sección explorada)


    ### Paso 5 — Revisión y validación

    Resumen de todos los datos ingresados con modal de confirmación '¿Estás seguro/a?'

    Estado de éxito: '¡Usuario Creado con Éxito!' con correo, contraseña provisional, botón
    'Reenviar correo'

    Estado de error: 'Algo salió mal' con botón 'Intentar de nuevo'


    ## Material de referencia

    - Figma design: https://www.figma.com/design/tR7Y1QD0Ic0aY9OOpcJ9ww/PLD?node-id=1584-58143

    - Figma board de flujos: https://www.figma.com/board/NPqPS0d6k9pH9Z5g5tyltV/Diagrama-PLD

    - Flujo documentado: docs/flujos/registro-sujeto-obligado.md


    ## Incógnitas

    - ¿Qué campos son requeridos (*) exactamente en cada paso? El diseño muestra algunos con * pero
    no todos.

    - ¿El Paso 4 (Responsable del cumplimiento) tiene su propio formulario detallado?

    - ¿Las validaciones de RFC y CURP tienen formato específico que validar?

    - ¿El endpoint BE actual acepta múltiples actividades vulnerables o solo una?

    - ¿Persona moral tiene los mismos pasos que persona física o un flujo distinto?

    - ¿Aplica igual para Inmobiliarias o hay campos diferentes?
