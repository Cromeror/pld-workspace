pm_proposal:
  problem: >-
    Queremos implementar una pantalla de gestión de usuarios para el SUPERADMIN que muestre una
    tabla con los usuarios WORKSPACE_ADMIN registrados en el sistema.


    ## Contexto del diseño (imagen compartida)

    La tabla tiene las siguientes columnas:

    - NOMBRE COMPLETO (con avatar de iniciales)

    - RFC

    - NO. CELULAR

    - CORREO

    - TIPO DE SUJETO (badge/chip, ej: 'Auxiliar')

    - ACCIONES (iconos ojo 👁️ y basura 🗑️)


    Footer con paginación: 'Mostrar 10 registros', botones Anterior / páginas numeradas / Siguiente,
    y 'Página 1 de 10'.


    ## Requerimientos


    ### Backend (pld-api)

    - Endpoint `GET /admin/users` protegido con JWT + rol SUPERADMIN.

    - Devuelve lista paginada de usuarios con rol WORKSPACE_ADMIN.

    - Response shape: `{ data: User[], total: number, page: number, pageSize: number }`.

    - El SUPERADMIN NO puede ver ni crear Auxiliares — el endpoint solo devuelve WORKSPACE_ADMIN,
    nunca AUXILIARY.

    - El endpoint de registro de auxiliares `POST /registration/auxiliaries` debe rechazar JWTs de
    SUPERADMIN con 403 (ya lo hace por RolesGuard, confirmar).

    - Agregar pruebas e2e para los endpoints nuevos.


    ### Frontend (pld-web)

    - Nueva página accesible solo para SUPERADMIN.

    - Implementar con AG Grid (ya instalado o instalarlo) o componente tabla reutilizable si ya
    existe.

    - Columnas según el diseño: avatar de iniciales, nombre completo, RFC, celular, correo, tipo de
    sujeto (badge), acciones (ver, eliminar).

    - Paginación server-side: 'Mostrar N registros' + navegación numérica.

    - Pruebas e2e (Playwright, ya configurado en pld-web/e2e/).


    ## Restricciones

    - El SUPERADMIN NO puede ver ni crear auxiliares — tanto en BE (endpoint filtrado) como en FE
    (sin ruta ni botón de 'Registrar auxiliar').

    - Usar AG Grid para la tabla si no hay un componente tabla suficientemente capaz en el sistema
    de diseño actual.

    - No afectar flujos existentes de registro de sujetos obligados ni de auxiliares.


    ## Archivos relevantes conocidos

    - `pld-api/apps/auth-users/src/admin/registration/` — módulo admin existente con patrón a seguir

    - `pld-web/src/pages/admin/ReportingEntityRegistrationPage.tsx` — única página admin actual

    - `pld-web/e2e/` — configuración Playwright existente

    - `pld-web/src/routes/index.tsx` — router con RoleProtectedRoute

    - `pld-api/apps/auth-users/src/registration/auxiliaries/auxiliaries.controller.ts` — endpoint
    auxiliares (verificar guard)
