pm_proposal:
  problem: >-
    ## Contexto


    El wizard de registro de sujeto obligado (notarías/inmobiliarias) tiene un paso de Revisión y
    validación (ReviewStep) que muestra un resumen de todos los datos antes de confirmar. Se
    detectaron 4 problemas en este paso:


    ## Problemas a resolver


    ### 1. Alerta correo → usuario

    El primer contacto agregado define el correo que se usará como credencial de acceso al sistema.
    El usuario no sabe esto. Se necesita mostrar una alerta/aviso visible en el paso de Contacto (o
    en el resumen) que diga que el correo del primer contacto será usado para crear el acceso al
    sistema.


    ### 2. Celular no aparece en resumen

    En la sección 'Datos de Contacto' del resumen, solo se muestran: Clave lada, Número de teléfono,
    Correo electrónico. Falta mostrar el Número de celular. Aplica tanto para la actividad principal
    como para la secundaria (SecondActivityBlock).


    ### 3. División administrativa muestra fieldName (ID) en lugar de nombre legible

    En la sección de domicilio de la actividad vulnerable, los campos de división administrativa
    (entidad federativa, municipio, colonia, etc.) muestran el fieldName técnico cuando no se
    encuentra el label en el mapa.


    ### 4. Actividad secundaria duplica colonia

    En SecondActivityBlock, la actividad vulnerable secundaria duplica la entrada de colonia.


    ## Archivos afectados

    - pld-web/src/components/organisms/reporting-entity/ReviewStep/index.tsx

    - pld-web/src/components/organisms/reporting-entity/ContactStep/index.tsx

    - pld-web/src/components/organisms/reporting-entity/AddVulnerableActivityModal/index.tsx


    ## Restricciones

    - Solo FE, sin cambios en BE ni base de datos

    - No rediseñar el componente, solo corregir los bugs y agregar el aviso
