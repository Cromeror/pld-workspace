  approach: >-
    **BE:**

    1. Extender `UsersPort` con `listWorkspaceAdminsPaginated(page: number, limit: number):
    Promise<{ data: UserEntity[]; total: number }>`.

    2. Implementar en `UsersAdapter` usando TypeORM `findAndCount` con `where: { role:
    UserRole.WORKSPACE_ADMIN, deletedAt: IsNull() }`, `skip: (page-1)*limit`, `take: limit`.

    3. Crear `ListUsersQueryDto` (`page?: number = 1`, `limit?: number = 10`) con class-validator.

    4. Crear `UserSummaryDto` (id, firstName, paternalSurname, maternalSurname, email, phone,
    profileType, role, createdAt) — sin passwordHash.

    5. Crear `ListUsersResponseDto` (`{ data: UserSummaryDto[]; total: number; page: number;
    pageSize: number }`).

    6. Crear `AdminUsersController` en `admin/users/` con `@Get() @UseGuards(JwtAuthGuard,
    RolesGuard) @Roles(SUPERADMIN)`, delega a `AdminUsersService`.

    7. Registrar `AdminUsersModule` en `AdminModule`.


    **FE:**

    1. Agregar `ADMIN_USERS: '/admin/users'` a `RoutesUrl`.

    2. Crear `adminUsersService.ts` con `listUsers(page, limit): Promise<ListUsersResponse>`.

    3. Crear `useListUsers(page, limit)` query en `adminUsersQueries.ts`.

    4. Crear `SuperAdminUsersPage.tsx` con `<DataTable>` PrimeReact, columnas según diseño,
    paginación lazy server-side, column de avatar con initials, badge para tipo de sujeto, botones
    icono para ver/eliminar (disabled en este change).

    5. Agregar ruta en `index.tsx`.


    **E2E (pld-api — usando supertest):**

    - `GET /admin/users` con JWT SUPERADMIN → 200 + array de WORKSPACE_ADMIN únicamente.

    - `GET /admin/users` con JWT WORKSPACE_ADMIN → 403.

    - `GET /admin/users` sin JWT → 401.

    - Paginación: `?page=1&limit=5` → `{ data: [...], total: N, page: 1, pageSize: 5 }`.


    **E2E (pld-web — Playwright):**

    - Login SUPERADMIN → navegar `/admin/users` → tabla visible con al menos 1 fila.

    - Columnas visibles: Nombre completo, RFC, Correo, Tipo de sujeto, Acciones.

    - SUPERADMIN no ve botón 'Registrar auxiliar' en ningún lugar.

    - Paginación: selector 'Mostrar N registros' funciona y cambia el contenido.
  estimate: >-
    M — 2-3 días: 1 día BE (endpoint + adapter + e2e BE), 1 día FE (página + DataTable + ruta), 0.5
    día e2e Playwright.
