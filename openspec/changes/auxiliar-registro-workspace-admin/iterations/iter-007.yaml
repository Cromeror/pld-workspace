  approach: >-
    **Backend (pld-api):**

    1. Agregar columna `username` (varchar 60, unique, nullable) a `UserEntity` + migración TypeORM.

    2. Modificar `CreateAuxiliaryDto`: reemplazar `email` (requerido) por `username` (requerido,
    3-60 chars, alfanumérico + guiones/puntos, único).

    3. En `AuxiliariesService.create()`: usar `username` en lugar de `email` al crear el
    `UserEntity`. Eliminar el envío de email post-commit (ya no hay email del auxiliar).

    4. Guardar `workspace.id` del JWT en el perfil auxiliar (`AuxiliaryProfileEntity.workspaceId` o
    campo equivalente) — verificar si ya existe la columna.

    5. Adaptar `LocalStrategy` / `AuthService.validateUser()` para que AUXILIARY haga lookup por
    `username`, los demás roles por `email`.


    **Frontend (pld-web):**

    1. Reemplazar campo `email` por `username` ('Nombre de usuario') en `UserDataStep.tsx` y
    `schemas.ts`.

    2. Actualizar tipo `AuxiliaryRegistrationPayload` en `types/auxiliary.ts` y el payload en
    `auxiliariesService.ts`.

    3. Actualizar pantalla de confirmación (step 3) para mostrar el `username` en lugar del email.
  estimate: >-
    5 story points. Confianza: media (hay riesgo en el cambio de LocalStrategy si toca código
    compartido con otros flujos de login).


    Breakdown:

    - BE entidad + migración: 1 SP

    - BE DTO + servicio (username, remover email, workspace): 1 SP

    - BE LocalStrategy (login por username para AUXILIARY): 1.5 SP

    - FE formulario + tipos + confirmación: 1 SP

    - Testing integration: 0.5 SP
