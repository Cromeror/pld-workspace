pm_proposal:
  problem: >-
    ## Contexto


    El wizard de registro de sujeto obligado tiene un paso final de 'Revisión y validación'
    (ReviewStep) que muestra un resumen de todos los datos ingresados. Cada sección tiene un ícono
    de lápiz (editar). El comportamiento actual:

    - En el wizard principal: navega al step correspondiente, sacando al usuario del resumen

    - En el modal de actividad secundaria (AddVulnerableActivityModal): también navega al step
    dentro del modal


    ## Comportamiento deseado


    Al hacer clic en el ícono de editar de cualquier sección del resumen, esa sección se reemplaza
    inline por el formulario de edición correspondiente, directamente dentro de la vista de Revisión
    y validación. El usuario edita ahí mismo, confirma, y vuelve a ver el resumen actualizado sin
    salir del paso de revisión.


    ## Alcance


    ### Frontend

    - El componente ReviewStep es reutilizable — ya se usa tanto en el wizard principal como en el
    AddVulnerableActivityModal. La implementación inline aplica automáticamente a ambos contextos.

    - Secciones con edición inline: Datos personales/identificación (PF y PM), Datos de contacto,
    Actividad vulnerable, Responsable del cumplimiento (solo PM)

    - La sección 'Sujeto obligado' (tipo de sujeto + tipo de persona) queda read-only — cambiarla
    implicaría resetear toda la estructura del registro

    - SecondActivityBlock (actividad secundaria ya registrada): mismas secciones editables inline

    - Dentro del AddVulnerableActivityModal, en su paso de revisión, también aplica edición inline

    - Reutilizar los step-components existentes (PhysicalIdentificationStep, ContactStep,
    VulnerableActivityStep, etc.) como formularios de edición inline

    - Deshabilitar botón Confirmar del wizard mientras haya una sección en modo edición


    ### Backend

    - Actualmente POST /:id/vulnerable-activity siempre crea una nueva actividad vulnerable (no hace
    upsert). Si el usuario edita desde el resumen, generaría un registro duplicado.

    - Se necesita implementar PUT /:id/vulnerable-activity en el BE (NestJS) que actualice la
    actividad vulnerable existente del registration, incluyendo su dirección y divisiones.

    - El resto de endpoints ya hacen upsert correctamente: saveIdentification,
    saveComplianceResponsible. Contacto ya tiene PUT /:id/contact/:contactId.


    ## Restricciones

    - Reutilizar step-components existentes, no rediseñar formularios

    - No romper el flujo actual de agregar actividad secundaria por primera vez

    - No cambiar el flujo de navegación entre steps del wizard (pasos 1-4)

    - No cambiar esquema DB — solo lógica de actualización en adapter
