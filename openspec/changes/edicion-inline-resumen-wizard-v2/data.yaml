dev_review:
  validations:
    - >-
      ReviewStep recibe onEdit(stepKey) que actualmente navega al step — se reemplaza por lógica
      inline con estado local editingSection
  technical_boundaries:
    - >-
      BE: nuevo endpoint PUT /admin/registration/:id/vulnerable-activity en
      registration.controller.ts + registration.service.ts + registration.adapter.ts
    - >-
      FE ReviewStep: agregar estado local editingSection: string | null. Al hacer clic en lápiz, en
      lugar de llamar onEdit(stepKey), se setea editingSection=stepKey
    - >-
      FE ReviewStep: cuando editingSection !== null, la sección correspondiente renderiza el
      step-component en lugar del bloque de resumen
    - >-
      FE ReviewStep: el step-component inline recibe el valor actual del state y un
      onSave(updatedValue) que persiste y limpia editingSection
    - >-
      FE ReviewStep: necesita recibir registrationId y profileType como props adicionales para poder
      llamar a registrationService
    - >-
      FE ReviewStep: botón Confirmar del wizard padre se deshabilita cuando editingSection !== null
      — requiere exponer editing state hacia arriba vía callback onEditingChange o prop
    - >-
      FE registrationService: agregar método updateVulnerableActivity(id, dto) → PUT
      /:id/vulnerable-activity
    - >-
      SecondActivityBlock también necesita editingSection propio ya que tiene secciones
      independientes de la actividad principal
  approach: >-
    Agregar estado editingSection a ReviewStep. Cada sección con lápiz, en lugar de llamar
    onEdit(stepKey) del padre, setea editingSection localmente. La sección en edición renderiza el
    step-component correspondiente reutilizando el componente existente. Al guardar, llama al
    servicio y vuelve a modo resumen. El botón Confirmar del wizard se deshabilita via prop/callback
    mientras editingSection !== null. BE: nuevo PUT vulnerable-activity en NestJS que busca la
    actividad existente por workspace y la actualiza junto con su dirección y divisiones.
  estimate: >-
    BE: ~2h (endpoint PUT vulnerable-activity + adapter update). FE: ~4h (estado inline en
    ReviewStep + SecondActivityBlock + registrationService). Total: ~6h
